[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ets2la_capture"
version = "1.1.1"
description = "Python client for reading ETS2LA capture frames from shared memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
synced = ["ets2la_telemetry>=1.0.2"]

[tool.setuptools.packages.find]
where = ["src"]